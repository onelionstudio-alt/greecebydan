name: Culture History implementation QA (no deployment)
on:
  push:
    branches: [feat/concierge-culture-history]
    paths: ['assets/**', 'travel-worker/**', 'tests/**', 'scripts/**', 'templates/**', '.github/workflows/culture-history.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          python -m pip install -r requirements.txt
          node --test travel-worker/*.test.mjs oauth-worker/worker.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
  culture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build reviewed frontend
        run: |
          python -m pip install -r requirements.txt
          python scripts/build.py
      - name: Install isolated browser QA
        run: |
          npm install --prefix "$RUNNER_TEMP/culture-qa" --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2
          node "$RUNNER_TEMP/culture-qa/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Culture and existing Boat Wine cards
        env:
          NODE_PATH: ${{ runner.temp }}/culture-qa/node_modules
        run: |
          node tests/browser-cards.cjs
          node tests/browser-culture.cjs
          node tests/browser-supplier-covers.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: culture-history-qa
          path: |
            docs/culture-history/evidence/
            docs/experience-card-implementation/evidence/
            docs/supplier-cover-images/evidence/
