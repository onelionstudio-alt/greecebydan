name: Article offer QA (no deployment)
on:
  push:
    branches: [feat/article-affiliate-cards]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          python -m pip install -r requirements.txt
          node --test travel-worker/*.test.mjs oauth-worker/worker.test.mjs scripts/culture-inventory/probe.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build.py
          python scripts/build_article_card_preview.py
          npm install --prefix "$RUNNER_TEMP/article-qa" --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2
          node "$RUNNER_TEMP/article-qa/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Article offers and concierge regression
        env:
          NODE_PATH: ${{ runner.temp }}/article-qa/node_modules
        run: |
          node tests/browser-article-offers.cjs
          node tests/browser-transfers.cjs
          node tests/browser-food.cjs
          node tests/browser-cards.cjs
          node tests/browser-culture.cjs
          node tests/browser-supplier-covers.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-offers-qa
          path: |
            docs/article-affiliate-cards/evidence/
