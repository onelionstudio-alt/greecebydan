name: Verify deployed PR23 staging (no deployment)
on:
  push:
    branches: [feat/experience-card-v3]
    paths: ['tests/browser-staging-deployed.cjs', '.github/workflows/staging-deployed-qa.yml']
permissions:
  contents: read
jobs:
  deployed-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install isolated QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/deployed-qa" --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2
          node "$RUNNER_TEMP/deployed-qa/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Verify actual remote frontend and Worker
        env:
          NODE_PATH: ${{ runner.temp }}/deployed-qa/node_modules
        run: node tests/browser-staging-deployed.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr23-deployed-staging-evidence
          path: docs/experience-card-implementation/evidence/
