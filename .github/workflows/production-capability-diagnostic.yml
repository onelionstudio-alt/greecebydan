name: Production capability diagnostic (no deployment)
on:
  push:
    branches: [qa/food-transfers-production]
    paths: ['scripts/production-capability-diagnostic.mjs', '.github/workflows/production-capability-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/production-capability-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-capability-diagnostic
          path: docs/production-check/evidence/
