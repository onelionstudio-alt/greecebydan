name: Build and publish Greece by Dan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Verify publishing and draft removal
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify OAuth security and travel helpers
        run: node --test oauth-worker/worker.test.mjs travel-worker/worker.test.mjs
      - name: Build website
        run: python scripts/build.py
      - name: Install browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/gbd-ui" --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/gbd-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify disabled release UI and price labels (synthetic fixtures)
        env:
          NODE_PATH: ${{ runner.temp }}/gbd-ui/node_modules
        run: node tests/browser-smoke.cjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
