name: Supplier cover performance observations (no deployment)
on:
  push:
    branches: [feat/viator-supplier-cover-images]
    paths: ['tests/browser-supplier-performance.cjs']
permissions:
  contents: read
jobs:
  observations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/cover-qa" --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/cover-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Observe actual published baseline and isolated staging
        env:
          NODE_PATH: ${{ runner.temp }}/cover-qa/node_modules
        run: node tests/browser-supplier-performance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-performance-observations
          path: docs/supplier-cover-images/evidence/performance-baseline.json
