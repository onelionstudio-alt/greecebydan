name = "greecebydan-travel-api"
main = "worker.mjs"
compatibility_date = "2026-10-10"
workers_dev = true

[vars]
CULTURE_ENABLED = "false"
VIATOR_IMAGES_APPROVED = "false"
SUPPLIER_COVERS_ENABLED = "false"
INTERACTIONS_ENABLED = "false"

[[ratelimits]]
name = "SEARCH_LIMIT"
namespace_id = "1047"
[ratelimits.simple]
limit = 20
period = 60

